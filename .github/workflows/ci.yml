name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Requerido por Pydantic Settings (backend/app/core/config.py).
      # Los tests de humo usan TestClient y no necesitan MySQL.
      SECRET_KEY: ci-test-secret-key-32chars-minimum!!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        # Lint incremental: no bloquea el merge mientras se limpia la deuda de estilo.
        # Cuando ruff check pase limpio, quitar continue-on-error.
        continue-on-error: true
        run: ruff check backend/app

      - name: Pytest (smoke tests)
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-32chars-minimum!!
          DATABASE_URL: mysql+pymysql://root@localhost/dbflash
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
