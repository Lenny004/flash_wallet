<!DOCTYPE html>
<html lang="es">

<head>
    <title>Flash</title>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="/css/styles.css" />
    <link type="text/css" rel="stylesheet" href="/css/fuente.css">
    <link rel="icon" type="icon/png" href="/resources/imgs/Flash_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <header id="header">
        
    </header>
    <main class="dashboard">
        <div class="encabezado">
            <h1 class="titulo">Información del usuario</h1>
        </div>
        <div class="logo">
            <img src="/resources/imgs/Flash_logo.png" alt="Logo">
        </div>
        <div class="form-container">
            <form id="perfil_form" action="post" class="form" autocomplete="off">
                <p class="subrayar" onclick="habilitarEdit()">Habilitar Editar ✏️</p>
                <label for="nombres" class="label">Nombres <span class="required">*</span></label>
                <input type="text" class="input" id="nombres" name="nombres" placeholder="Nombre" maxlength="50"
                    required disabled>
                <label for="apellidos" class="label">Apellidos <span class="required">*</span></label>
                <input type="text" class="input" id="apellidos" name="apellidos" placeholder="Apellidos" maxlength="50"
                    required disabled>
                <label for="email" class="label">Correo <span class="required">*</span></label>
                <input type="email" class="input miInput" id="email" name="email" placeholder="correo@gmail.com"
                    maxlength="50" required disabled>
                <label for="direccion" class="label">Dirección <span class="required">*</span></label>
                <input type="text" class="input miInput" id="direccion" name="direccion" placeholder="Address" maxlength="150"
                    required disabled>
                <label for="telefono" class="label">Teléfono <span class="required">*</span></label>
                <input type="text" class="input miInput" id="telefono" name="telefono" placeholder="+503 00000000"
                    maxlength="15" required disabled>
                <input type="submit" value="Actualizar" class="btn primary-button" id="btnUpdate">
                <input type="button" value="Cerrar Sesión" class="btn primary-button" onclick="logOut()">
            </form>
        </div>
    </main>
    <nav>
        <div class="navbar">
            <a href="dashboard.html" class="btn primary-button">
                <img src="/resources/icons/home.png" alt="home">
            </a>
            <a href="pago.html" class="btn primary-button">
                <img src="/resources/icons/billete.png" alt="Pagar">
            </a>
            <a href="escanear_servicio.html" class="btn primary-button">
                <img src="/resources/icons/scanner.png" alt="Escanear">
            </a>
            <a href="recarga.html" class="btn primary-button">
                <img src="/resources/icons/recharge.png" alt="Recargar">
            </a>
        </div>
    </nav>
    <script type="text/javascript" src="/controllers/config.js"></script>
    <script type="text/javascript" src="/controllers/auth.js"></script>
    <script type="text/javascript" src="/resources/js/sweetalert2.all.min.js"></script>
    <script type="text/javascript" src="/controllers/componentes.js"></script>
    <script type="text/javascript" src="/controllers/online.js"></script>
    <script type="module" src="/src/pages/perfil.ts"></script>
</body>

</html>
