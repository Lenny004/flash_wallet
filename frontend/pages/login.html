<!DOCTYPE html>
<html lang="es">
<head>
    <title>Flash</title>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="/css/styles.css" />
    <link type="text/css" rel="stylesheet" href="/css/fuente.css">
    <link rel="icon" type="icon/png" href="/resources/imgs/Flash_logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>

<body>
    <main class="dashboard">
        <div class="logo">
            <img src="/resources/imgs/Flash_logo.png" alt="Logo">
        </div>
        <div class="login-form borde">
            <h2>Inicio de sesión</h2>
            <p>Inicia sesión para acceder a tu cuenta</p>
            <form id="login_form" action="post" class="form" autocomplete="off">
                <div class="input-group input">
                    <label for="usuario"><img src="/resources/icons/mail_red.png" alt="Correo"></label>
                    <input type="text" class="input" id="usuario" name="usuario" placeholder="correo@gmail.com *" maxlength="50" required aria-label="Correo o usuario *">
                </div>
                <div class="input-group input">
                    <label for="contra"><img src="/resources/icons/password_red.png" alt="Contraseña"></label>
                    <input type="password" class="input" id="contra" name="contra" placeholder="Contraseña *" maxlength="50"
                    required aria-label="Contraseña *">
                    <span class="toggle-password" id="togglePassword">
                        <label for="contra"><img src="/resources/icons/ocultar.png" alt="Contraseña"></label>
                    </span>
                </div>
                <input type="submit" value="Iniciar sesión" class="btn primary-button">
            </form>
            <a href="registro.html" class="subrayar">Crear cuenta</a>
        </div>
    </main>
    <script type="text/javascript" src="/resources/js/sweetalert2.all.min.js"></script>
    <script src="/controllers/config.js"></script>
    <script type="module" src="/src/pages/login.ts"></script>
</body>
</html>
