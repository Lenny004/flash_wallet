services:
  db:
    image: mysql:8
    container_name: flash_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-flash_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dbflash}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./dbflash.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-flash_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
